<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Content Marketing · Portugal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="status-bar" id="statusBar">A carregar...</div>

<div class="container" id="container">

  <!-- ============ PERIOD PICKER ============ -->
  <div class="picker">
    <div class="pgroup" id="presetGroup">
      <button class="pbtn" data-preset="30d">30d</button>
      <button class="pbtn" data-preset="90d">90d</button>
      <button class="pbtn" data-preset="mtd">MtD</button>
      <button class="pbtn active" data-preset="ytd">YtD</button>
      <button class="pbtn" data-preset="tudo">Tudo</button>
    </div>
    <div class="dgroup">
      <label for="iniInput">De</label>
      <input type="date" id="iniInput">
      <label for="fimInput">até</label>
      <input type="date" id="fimInput">
      <button class="apply" id="applyBtn">Aplicar</button>
    </div>
    <div class="range-label" id="rangeLabel">
      <span id="rangeText">—</span>
      <span class="cache-pill" id="cachePill" title="">—</span>
      <button class="refresh-btn" id="refreshBtn" title="Recarregar o ficheiro de dados">↻</button>
    </div>
  </div>

  <div id="content"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="motor.js"></script>
<script src="render.js"></script>
<script>
/* ---------- wiring ----------
 * Este index.html serve as TRES rotas PT (/bm-pt/, /cxpress-pt/, /elife-pt/). A marca
 * sai do path, e nao de uma copia por marca — assim os tres nunca divergem. O guarda-chuva
 * copia este mesmo ficheiro pras tres pastas, cada uma com o seu dados-pt-*.json.
 */
const JSON_POR_SLUG = {
  'bm-pt': 'dados-pt-bm.json',
  'cxpress-pt': 'dados-pt-cxpress.json',
  'elife-pt': 'dados-pt-elife.json',
};
const MESES_C = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

function ficheiroDados() {
  const seg = window.location.pathname.split('/').filter(Boolean)[0] || '';
  // Sem segmento nenhum (ficheiro aberto solto, dev local), cai no Buzzmonitor.
  if (!seg) return JSON_POR_SLUG['bm-pt'];
  const f = JSON_POR_SLUG[seg];
  // Sob o guarda-chuva, rota desconhecida NAO cai no Buzzmonitor: servir os dados de
  // uma marca sob o titulo de outra e pior do que falhar. Quem apanha e o try/catch
  // de quem chama ensureDados().
  if (!f) throw new Error(`Rota "/${seg}/" nao tem ficheiro de dados mapeado.`);
  return f;
}

let DADOS = null, firstLoad = true;
const statusBar = document.getElementById('statusBar');
const container = document.getElementById('container');
const content = document.getElementById('content');

function showStatus(msg, isError = false) {
  statusBar.textContent = msg;
  statusBar.classList.toggle('error', isError);
  statusBar.classList.add('show');
}
function hideStatus() { statusBar.classList.remove('show'); }
function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Versao do formato do JSON que este painel sabe ler. Bumpar JUNTO com o SCHEMA_VERSION do
// exportador e o schema_version de dashboards-umbrella/contratos/pt.json: o
// validar_contrato.py falha se os tres divergirem. Versao diferente = aviso no topo e o painel
// renderiza assim mesmo. O numero ja foi conferido no CI antes do deploy; isto e a rede da aba
// aberta em cache e de deploy feito sem passar pelo validador.
const SCHEMA_ESPERADO = 1;

function avisarContrato(msg) {
  if (document.getElementById('avisoContrato')) return;
  const el = document.createElement('div');
  el.id = 'avisoContrato';
  el.setAttribute('role', 'alert');
  // Inline (o buzz-br nem tem CSS externo) e no fluxo, logo abaixo da barra de navegacao fixa:
  // persistente, ao contrario do statusBar, que o hideStatus() apaga depois do render.
  el.style.cssText = 'position:relative;z-index:800;background:#8a2b06;color:#fff;'
    + 'font:600 13px/1.45 system-ui,-apple-system,sans-serif;padding:10px 16px;text-align:center';
  el.textContent = msg;
  const nav = document.querySelector('.dnav');
  if (nav && nav.parentNode === document.body) nav.after(el); else document.body.prepend(el);
  console.warn('[contrato]', msg);
}

function conferirVersao(D) {
  const v = D.schema_version;
  if (v !== SCHEMA_ESPERADO) {
    const recebido = v == null ? 'dados sem versão' : 'v' + v;
    avisarContrato(v > SCHEMA_ESPERADO
      ? `Esta página está em cache e desatualizada (espera dados v${SCHEMA_ESPERADO}, recebeu v${v}). Recarregue com Ctrl+Shift+R. Até lá, os números abaixo podem estar incompletos.`
      : `Dados fora do contrato: a página espera dados v${SCHEMA_ESPERADO} e recebeu ${recebido}. Os números abaixo podem estar errados. Confirme antes de os usar.`);
  }
  // motor.js faz new Set(DADOS.ganhas || []): sem estas chaves o fecho e os perdidos
  // zeram em silencio, sem erro. O validar_contrato.py ja barra isso antes do deploy;
  // aqui e a rede de quem deployou sem passar por ele.
  if (!Array.isArray(D.etapas) || !Array.isArray(D.ganhas) || !Array.isArray(D.terminais)) {
    avisarContrato('Dados incompletos (etapas, ganhas ou terminais em falta): os '
      + 'fechamentos e os perdidos podem aparecer a zero. Avise a equipa antes de usar.');
  }
}

async function ensureDados() {
  if (DADOS) return DADOS;
  const f = ficheiroDados();
  const res = await fetch(f, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`Falha ao carregar ${f} (HTTP ${res.status})`);
  DADOS = await res.json();
  conferirVersao(DADOS);
  MotorPT.carregar(DADOS);
  document.title = `Content Marketing · ${DADOS.nome}`;
  return DADOS;
}
function hojeExport() { return (DADOS && DADOS.gerado_em) ? DADOS.gerado_em : toISO(new Date()); }

function updateRangeLabel(ini, fim, n) {
  const a = new Date(ini + 'T00:00:00'), b = new Date(fim + 'T00:00:00');
  const dias = Math.round((b - a) / 86400000) + 1;
  const rng = `${String(a.getDate()).padStart(2, '0')} ${MESES_C[a.getMonth()]} ${a.getFullYear()}`
    + ` – ${String(b.getDate()).padStart(2, '0')} ${MESES_C[b.getMonth()]} ${b.getFullYear()}`;
  document.getElementById('rangeText').innerHTML =
    `<b>${rng}</b> · ${dias} ${dias === 1 ? 'dia' : 'dias'} · ${n} deals`;
  const pill = document.getElementById('cachePill');
  const g = new Date(hojeExport() + 'T00:00:00');
  pill.textContent = `dados de ${String(g.getDate()).padStart(2, '0')} ${MESES_C[g.getMonth()]} ${g.getFullYear()}`;
  pill.title = `Exportado em ${hojeExport()} — atualizado sob demanda por /dashboard-atualizar`;
}

async function load(ini, fim) {
  container.classList.add('loading');
  if (firstLoad) showStatus('A carregar dados…');
  try {
    await ensureDados();
    const d = MotorPT.agregar(ini, fim);   // agregacao 100% no navegador
    RenderPT.render(d, content);
    updateRangeLabel(ini, fim, d.kpis.total);
    hideStatus();
    firstLoad = false;
  } catch (e) {
    showStatus(`Erro: ${e.message}`, true);
    console.error(e);
  } finally {
    container.classList.remove('loading');
  }
}

function presetRange(name) {
  // ancora = data do export, nao o relogio do PC (bate com o snapshot)
  const fim = new Date(hojeExport() + 'T00:00:00');
  let ini = new Date(fim);
  if (name === '30d') ini.setDate(fim.getDate() - 29);
  else if (name === '90d') ini.setDate(fim.getDate() - 89);
  else if (name === 'mtd') ini = new Date(fim.getFullYear(), fim.getMonth(), 1);
  else if (name === 'ytd') ini = new Date(fim.getFullYear(), 0, 1);
  else if (name === 'tudo') {
    const lim = MotorPT.limites();
    if (lim.min) ini = new Date(lim.min + 'T00:00:00');
  }
  return { ini: toISO(ini), fim: toISO(fim) };
}
function setPickerInputs(ini, fim) {
  document.getElementById('iniInput').value = ini;
  document.getElementById('fimInput').value = fim;
}

document.addEventListener('DOMContentLoaded', async () => {
  document.querySelectorAll('#presetGroup .pbtn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('#presetGroup .pbtn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      try {
        await ensureDados();
      } catch (e) {
        showStatus(`Erro ao carregar dados: ${e.message}`, true);
        return;
      }
      const { ini, fim } = presetRange(btn.dataset.preset);
      setPickerInputs(ini, fim);
      load(ini, fim);
    });
  });

  document.getElementById('applyBtn').addEventListener('click', () => {
    const ini = document.getElementById('iniInput').value;
    const fim = document.getElementById('fimInput').value;
    if (!ini || !fim) { showStatus('Escolha as duas datas.', true); return; }
    if (ini > fim) { showStatus('A data inicial é posterior à final.', true); return; }
    document.querySelectorAll('#presetGroup .pbtn').forEach((b) => b.classList.remove('active'));
    load(ini, fim);
  });

  document.getElementById('refreshBtn').addEventListener('click', () => {
    DADOS = null; firstLoad = true;
    const ini = document.getElementById('iniInput').value;
    const fim = document.getElementById('fimInput').value;
    load(ini, fim);
  });

  try {
    await ensureDados();
  } catch (e) {
    showStatus(`Erro ao carregar dados: ${e.message}`, true);
    return;
  }
  const { ini, fim } = presetRange('ytd');
  setPickerInputs(ini, fim);
  load(ini, fim);
});
</script>
</body>
</html>
