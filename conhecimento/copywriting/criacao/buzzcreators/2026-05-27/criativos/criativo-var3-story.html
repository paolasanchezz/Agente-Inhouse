<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Var3 story</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --primary:#3a1652; --secondary:#ff8119; --white:#fff; --gradient-brand:linear-gradient(100deg,#6a3895 0%,#ff8119 60%,#ff7300 100%); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:'DM Sans',system-ui,sans-serif; }
  .creative {
    width:1080px; height:1920px;
    background:
      radial-gradient(circle at 50% -8%, rgba(106,56,149,0.6) 0%, transparent 50%),
      radial-gradient(circle at 90% 95%, rgba(255,129,25,0.22) 0%, transparent 42%),
      #2c1040;
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    padding:180px 96px 0; color:var(--white);
  }
  .creative::after { content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,0.05) 1px,transparent 1px); background-size:6px 6px; }
  .c-top { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2; }
  .c-logo { height:64px; filter:brightness(0) invert(1); }
  .c-pill { font-size:23px; font-weight:700; text-transform:uppercase; letter-spacing:0.18em; color:var(--primary); background:var(--secondary); padding:15px 28px; border-radius:999px; }
  .c-body { display:flex; flex-direction:column; margin-top:96px; position:relative; z-index:2; }
  .c-headline { font-size:80px; font-weight:700; line-height:1.06; letter-spacing:-0.025em; max-width:880px; margin-bottom:20px; }
  .c-headline .hl-accent { color:var(--secondary); }
  .c-sub { font-size:40px; font-weight:400; color:rgba(255,255,255,0.72); margin-bottom:80px; }
  .c-list { display:flex; flex-direction:column; gap:24px; margin-bottom:96px; max-width:900px; }
  .c-chip { display:inline-flex; align-items:center; gap:18px; font-size:38px; font-weight:500; color:var(--white); background:rgba(255,255,255,0.07); border:1.5px solid rgba(255,255,255,0.16); padding:28px 40px; border-radius:999px; align-self:flex-start; }
  .c-chip .dot { width:18px; height:18px; border-radius:50%; background:var(--secondary); flex:none; }
  .c-cta { align-self:flex-start; display:inline-flex; background:var(--secondary); color:var(--primary); font-size:46px; font-weight:700; padding:40px 76px; border-radius:999px; box-shadow:0 22px 52px rgba(255,115,0,0.4); }
  .c-footer { position:relative; z-index:2; font-size:24px; color:rgba(255,255,255,0.5); border-top:1px solid rgba(255,255,255,0.14); padding-top:34px; }
</style>
</head>
<body>
  <div class="creative">
    <div class="c-top">
      <img class="c-logo" src="./assets/logo-full-color.svg" alt="Buzzcreators" />
      <span class="c-pill">Material gratuito</span>
    </div>
    <div class="c-body">
      <h1 class="c-headline">Vai montar sua campanha de influ&ecirc;ncia <span class="hl-accent">do zero</span> de novo?</h1>
      <p class="c-sub">Tem um atalho gratuito pra isso.</p>
      <div class="c-list">
        <span class="c-chip"><span class="dot"></span>Cases globais e do Brasil</span>
        <span class="c-chip"><span class="dot"></span>Benchmark do setor</span>
        <span class="c-chip"><span class="dot"></span>Template de briefing</span>
        <span class="c-chip"><span class="dot"></span>Playbook 30-60-90</span>
      </div>
      <span class="c-cta">Acesse o material</span>
    </div>
    <div class="c-footer">Estado da Arte do Marketing de Influ&ecirc;ncia &middot; Buzzcreators</div>
  </div>
</body>
</html>
