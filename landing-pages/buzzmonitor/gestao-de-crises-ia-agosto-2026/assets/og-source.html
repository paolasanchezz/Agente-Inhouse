<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#ffffff; --primary:#390155; --dark:#25003a;
    --accent:#EB7C2E; --accent2:#DE2451; --yellow:#FCBD4F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:linear-gradient(150deg,var(--primary) 0%,var(--dark) 100%);
    font-family:'Poppins','Open Sans',Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 90px;color:#fff;
  }
  .glow1{position:absolute;width:560px;height:560px;border-radius:50%;
    top:-200px;right:-160px;
    background:radial-gradient(circle,rgba(222,36,81,0.45) 0%,transparent 68%)}
  .glow2{position:absolute;width:520px;height:520px;border-radius:50%;
    bottom:-220px;left:-160px;
    background:radial-gradient(circle,rgba(235,124,46,0.20) 0%,transparent 70%)}
  .overline{
    display:inline-flex;align-items:center;gap:14px;
    font-size:24px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;
    color:#fff;background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:9999px;padding:13px 28px;margin-bottom:38px;
    width:fit-content;position:relative;z-index:2;
  }
  .dot{width:14px;height:14px;border-radius:50%;background:var(--yellow)}
  .h1{font-size:76px;font-weight:900;line-height:1.02;color:#fff;
    letter-spacing:-2px;position:relative;z-index:2}
  .h1 .hl{color:var(--accent)}
  .sub{font-size:34px;font-weight:500;line-height:1.3;color:rgba(255,255,255,0.88);
    letter-spacing:-0.3px;margin-top:22px;position:relative;z-index:2;max-width:900px}
  .brand{position:absolute;bottom:54px;left:90px;display:flex;align-items:center;z-index:2}
  .brand img{height:54px;width:auto}
  .tag{position:absolute;bottom:60px;right:90px;z-index:2;
    font-size:22px;font-weight:500;color:rgba(255,255,255,0.8)}
</style>
</head>
<body>
  <span class="glow1"></span>
  <span class="glow2"></span>
  <div class="overline"><span class="dot"></span>Webinar gratuito &middot; 25 de Agosto</div>
  <div class="h1">Gestão de <span class="hl">Crises</span> com IA.</div>
  <div class="sub">Antecipação, monitoramento e resposta estratégica nas redes sociais, com demonstração ao vivo.</div>
  <div class="brand"><img src="../../../../brand/buzzmonitor/assets/logos/logo-reversed.png" alt=""></div>
  <div class="tag">11h (Brasília) &middot; Online e Ao Vivo</div>
</body>
</html>
