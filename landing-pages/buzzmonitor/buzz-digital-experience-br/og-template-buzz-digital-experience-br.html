<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG · Museu das Conversas Perdidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Lato:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#07030C;
  background-image:radial-gradient(90% 120% at 78% 8%,#2A0645 0%,#07030C 62%);
  font-family:"Lato",sans-serif;color:#fff;position:relative}
.bubbles{position:absolute;inset:0}
.b{position:absolute;z-index:1;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);
  border-radius:14px;padding:11px 15px;font-size:15px;color:rgba(255,255,255,.42);white-space:nowrap}
.wrap{position:relative;z-index:2;padding:64px 70px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.tag{font-family:"League Spartan",sans-serif;font-weight:700;font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:#EB7C2E}
h1{font-family:"League Spartan",sans-serif;font-weight:800;font-size:88px;line-height:.92;letter-spacing:-.025em;max-width:15ch}
h1 em{font-style:normal;color:#EB7C2E}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
img.logo{position:absolute;right:70px;bottom:56px;width:290px;height:auto;opacity:.95}
.claim{font-size:22px;color:rgba(255,255,255,.62);max-width:44ch;line-height:1.4}
img{width:250px;opacity:.95}
.rule{position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,#EB7C2E,#0E9D9B)}
</style>
</head>
<body>
<div class="rule"></div>
<div class="bubbles">
  <div class="b" style="left:905px;top:272px">“Alguém sabe se funciona?”</div>
  <div class="b" style="left:855px;top:120px">“Faz dois dias que espero resposta.”</div>
  <div class="b" style="left:900px;top:196px">“Eu prefiro a concorrência.”</div>
  <div class="b" style="left:860px;top:425px">“Onde eu compro?”</div>
  <div class="b" style="left:905px;top:345px">“Preciso de uma indicação.”</div>
  <div class="b" style="left:905px;top:40px">“Nunca me responderam.”</div>
</div>
<div class="wrap">
  <p class="tag">Uma experiência da Buzzmonitor</p>
  <h1>Museu das <em>Conversas Perdidas</em></h1>
  <div class="foot">
    <p class="claim">Enquanto você está aqui, o México segue falando das marcas.</p>
  </div>
</div>
<img class="logo" src="../../../brand/buzzmonitor/assets/logos/logo-reversed.svg" alt="Buzzmonitor">
</body>
</html>
