<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#ffffff; --primary:#EB7C2E; --dark:#390155; --lighter:#F2D8FF;
    --accent:#0E9D9B; --warning:#FCBD4F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:var(--bg);
    font-family:'League Spartan','Lato',Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 90px;
  }
  .pill{position:absolute;border-radius:9999px}
  .overline{
    display:inline-flex;align-items:center;gap:12px;
    font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--dark);background:var(--lighter);
    border-radius:9999px;padding:14px 30px;margin-bottom:36px;
    width:fit-content;
  }
  .dot{width:14px;height:14px;border-radius:50%;background:var(--primary)}
  h1{font-size:64px;font-weight:800;line-height:1.15;color:var(--dark);max-width:900px;letter-spacing:-1px}
  .brand{position:absolute;bottom:56px;left:90px;display:flex;align-items:center}
  .brand img{height:56px;width:auto}
</style>
</head>
<body>
  <span class="pill" style="width:80px;height:280px;background:var(--lighter);top:-60px;right:140px"></span>
  <span class="pill" style="width:56px;height:190px;border:5px solid var(--primary);bottom:-40px;right:60px"></span>
  <span class="pill" style="width:170px;height:60px;background:var(--warning);bottom:140px;right:-30px"></span>
  <div class="overline"><span class="dot"></span>Buzzmonitor &middot; Social listening com IA</div>
  <h1>Sua marca &eacute; comentada nas redes todos os dias. Algu&eacute;m est&aacute; ouvindo?</h1>
  <div class="brand"><img src="../../../brand/buzzmonitor/assets/logos/logo-primary.png" alt=""></div>
</body>
</html>
