<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root{
    --roxo:#390155; --teal:#0E9D9B; --laranja:#EB7C2E; --laranja-light:#FFD5C3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:linear-gradient(135deg,var(--teal),var(--roxo));
    font-family:'League Spartan','Segoe UI',Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 90px;
  }
  .shape{position:absolute;border-radius:50%}
  .overline{
    display:inline-flex;align-items:center;gap:12px;
    font-family:'Lato',Arial,sans-serif;
    font-size:24px;font-weight:700;letter-spacing:.04em;
    color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);
    border-radius:9999px;padding:12px 28px;margin-bottom:34px;
    width:fit-content;
  }
  .dot{width:12px;height:12px;border-radius:50%;background:var(--laranja)}
  h1{font-size:62px;font-weight:800;line-height:1.12;color:#fff;max-width:900px;letter-spacing:-1px}
  .brand{position:absolute;bottom:56px;left:90px;display:flex;align-items:center}
  .brand img{height:48px;width:auto}
</style>
</head>
<body>
  <span class="shape" style="width:420px;height:420px;background:rgba(255,255,255,.08);top:-160px;right:-120px"></span>
  <span class="shape" style="width:220px;height:220px;background:rgba(252,189,79,.18);bottom:-90px;right:200px"></span>
  <div class="overline"><span class="dot"></span>Buzz Talks · Evento presencial · 01/10/2026 · São Paulo</div>
  <h1>Gestão Multimarcas para Agências</h1>
  <div class="brand"><img src="../../../../brand/buzzmonitor/assets/logos/logo-reversed.png" alt=""></div>
</body>
</html>
