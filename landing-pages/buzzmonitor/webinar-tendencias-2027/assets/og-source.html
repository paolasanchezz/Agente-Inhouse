<!doctype html>
<html lang="es-419"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Poppins:wght@300;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#f6f4f0;font-family:"Inter Tight",sans-serif;color:#120d24;position:relative;isolation:isolate}
  .b1,.b2{position:absolute;border-radius:50%;filter:blur(90px);z-index:-1;opacity:.6}
  .b1{width:520px;height:520px;background:#ffc79e;left:-160px;bottom:-160px}
  .b2{width:600px;height:600px;background:#d8cbff;right:-160px;top:-220px}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:center}
  .top img{width:190px}
  .pill{font-size:22px;font-weight:600;padding:10px 20px;border-radius:99px;background:#120d24;color:#fff}
  .logo{font-family:Poppins,sans-serif;line-height:1}
  .logo .l1{font-weight:300;font-size:30px;letter-spacing:.34em;text-transform:uppercase;color:#5f5a6e}
  .logo .l2{display:flex;align-items:baseline;gap:16px;margin-top:8px}
  .logo b{font-weight:800;font-size:140px;letter-spacing:-.04em;text-transform:uppercase;line-height:.9}
  .logo i{font-style:normal;font-weight:700;font-size:78px;color:#eb7c2e}
  .logo svg{display:block;width:620px;margin-top:10px}
  .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
  .bot p{margin:0;font-size:34px;font-weight:600;letter-spacing:-.02em;max-width:560px;line-height:1.15;text-wrap:balance}
  .date{text-align:right;white-space:nowrap;font-size:24px;font-weight:500;color:#5f5a6e;line-height:1.4}
  .date strong{display:block;color:#3a12a3;font-size:30px;font-weight:600}
</style></head><body>
<div class="b1"></div><div class="b2"></div>
<div class="wrap">
  <div class="top"><img src="../../../../brand/buzzmonitor/assets/logos/logo-primary.svg" alt=""><span class="pill">Webinar en vivo · Gratuito</span></div>
  <div class="logo"><div class="l1">Marketing</div><div class="l2"><b>Trends</b><i>2027</i></div>
    <svg viewBox="0 0 400 34"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#eb7c2e" stop-opacity=".15"/><stop offset="1" stop-color="#eb7c2e"/></linearGradient></defs><path d="M2 28 L80 24 L130 28 L200 15 L250 20 L384 6" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="384" cy="6" r="5.5" fill="#eb7c2e"/></svg></div>
  <div class="bot"><p>Las 9 tendencias de marketing para 2027 y qué hacer con cada una</p><div class="date"><strong>10 de diciembre</strong>10:00 MX · 11:00 COL/PER · 13:00 CL/ARG</div></div>
</div>
</body></html>
