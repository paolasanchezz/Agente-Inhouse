<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#081b3a; --primary:#ff6b16; --lighter:#ec174c; --accent:#0e9d9b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:var(--bg);
    font-family:'League Spartan','Lato',Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 90px;
  }
  .glow{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5}
  .overline{
    display:inline-flex;align-items:center;gap:12px;
    font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    border-radius:9999px;padding:14px 30px;margin-bottom:36px;
    width:fit-content;
  }
  .dot{width:14px;height:14px;border-radius:50%;background:var(--primary)}
  h1{font-size:60px;font-weight:800;line-height:1.15;color:#fff;max-width:920px;letter-spacing:-1px}
  .brand{position:absolute;bottom:56px;left:90px;display:flex;align-items:center}
  .brand img{height:48px;width:auto}
</style>
</head>
<body>
  <span class="glow" style="width:420px;height:420px;background:var(--primary);top:-160px;right:-80px"></span>
  <span class="glow" style="width:320px;height:320px;background:var(--lighter);bottom:-140px;right:120px"></span>
  <div class="overline"><span class="dot"></span>Buzzmonitor &middot; Atendimento com IA</div>
  <h1>Centralize o atendimento multicanal com IA em tempo real</h1>
  <div class="brand"><img src="../../../../brand/buzzmonitor/assets/logos/logo-reversed.png" alt=""></div>
</body>
</html>
