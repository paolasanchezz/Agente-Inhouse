<!doctype html>
<!--
  OG image 1200x630 da LP buzz-academy-experience (dark Buzzmonitor).
  Renderizar (Windows: screenshot em $TEMP e copiar pra assets/og-image.png):

  chrome - -headless=new - -disable-gpu - -hide-scrollbars - -window-size=1200,630 \
    - -virtual-time-budget=4000 - -screenshot="og-image.png" "file:///.../og-template-buzz-academy-experience.html"

  (remover espacos nos flags acima — escritos com espaco para nao quebrar parsing de comentario)
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140222; --lilas:#F2D8FF; --laranja:#EB7C2E; --laranja-hi:#FF9E5E;
    --teal:#0E9D9B; --teal-soft:#CDFDFC; --text:#F6F0FC; --muted:#CDBCDF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:var(--bg);
    font-family:'Hanken Grotesk',Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 90px;
  }
  .glow{position:absolute;inset:0;
    background:
      radial-gradient(ellipse 58% 52% at 14% 22%, rgba(242,216,255,0.14) 0%, transparent 60%),
      radial-gradient(ellipse 52% 48% at 88% 70%, rgba(235,124,46,0.18) 0%, transparent 58%),
      radial-gradient(ellipse 44% 40% at 55% 104%, rgba(14,157,155,0.16) 0%, transparent 55%);
  }
  .overline{
    position:relative;display:inline-flex;align-items:center;gap:14px;
    font-size:24px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--lilas);background:rgba(242,216,255,0.08);
    border:2px solid rgba(242,216,255,0.30);
    border-radius:9999px;padding:14px 32px;margin-bottom:42px;
    width:fit-content;
  }
  .overline .dot{width:14px;height:14px;border-radius:50%;background:var(--laranja)}
  h1{
    position:relative;font-family:'League Spartan',Arial,sans-serif;
    font-size:118px;font-weight:900;line-height:0.94;color:var(--text);
    letter-spacing:-3px;max-width:980px;
  }
  h1 span{color:var(--laranja-hi)}
  .trilhas{position:relative;display:flex;gap:34px;margin-top:44px}
  .trilha{display:inline-flex;align-items:center;gap:12px;font-size:27px;font-weight:600}
  .trilha .dot{width:13px;height:13px;border-radius:50%}
  .t-int{color:var(--lilas)} .t-int .dot{background:var(--lilas)}
  .t-gro{color:var(--teal-soft)} .t-gro .dot{background:var(--teal)}
  .t-bra{color:#FFD5C3} .t-bra .dot{background:var(--laranja)}
  .brand{position:absolute;bottom:54px;right:90px;display:flex;align-items:center}
  .brand img{height:56px;width:auto}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="overline"><span class="dot"></span>Buzz Academy · Formação gratuita</div>
  <h1>Buzz Academy <span>Experience</span></h1>
  <div class="trilhas">
    <span class="trilha t-int"><span class="dot"></span>Intelligence</span>
    <span class="trilha t-gro"><span class="dot"></span>Growth</span>
    <span class="trilha t-bra"><span class="dot"></span>Branding</span>
  </div>
  <div class="brand"><img src="../../../brand/buzzmonitor/assets/logos/logo-reversed.svg" alt=""></div>
</body>
</html>
