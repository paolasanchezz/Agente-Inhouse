  <!-- Despachante pos-envio (roda antes de qualquer render).
       A LP de captura grava o destino num cookie de .buzzmonitor.com (bm_next), porque esta
       pagina vive noutro subdominio e nao enxerga o sessionStorage da captura. Aqui le, apaga e
       encaminha. Travas: consome o cookie antes de decidir (sem loop), so aceita https em
       buzzmonitor.com ou subdominio (sem open redirect), nao redireciona pra si mesma. A validade
       de 30 min vem do Max-Age do cookie. Sem cookie, fica nesta pagina.
       Detalhes: landing-pages/GUIA-webinar-perpetuo-destino.md -->
  <script>
    (function () {
      try {
        var m = document.cookie.match(/(?:^|;\s*)bm_next=([^;]*)/);
        if (!m) return;
        document.cookie = 'bm_next=; Domain=.buzzmonitor.com; Path=/; Max-Age=0; SameSite=Lax; Secure';
        var to = new URL(decodeURIComponent(m[1]));
        var host = to.hostname;
        if (to.protocol !== 'https:') return;
        if (host !== 'buzzmonitor.com' && host.slice(-16) !== '.buzzmonitor.com') return;
        var norm = function (p) { return p.replace(/\/+$/, ''); };
        if (host === location.hostname && norm(to.pathname) === norm(location.pathname)) return;
        location.replace(to.href);
      } catch (e) { /* cookie ilegivel: segue nesta pagina */ }
    })();
  </script>

    /* ============ TOKENS ============ */
    :root {
      --primary: #390155; --primary-darker: #26013a; --primary-light: #F2D8FF;

      --container-max: 1200px; --container-pad: 24px;
      --radius-md: 9px; --radius-pill: 9999px;
      --ease: cubic-bezier(.22,.8,.22,1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: var(--font-body); font-size: 17px; line-height: 1.6;
      color: var(--primary); background: var(--neutral-50);

    h1 { font-family: var(--font-heading); margin: 0; }
    p { margin: 0; }
    a { color: var(--primary); text-decoration: none; }
    .container { width: 100%; max-width: var(--container-max); margin: 0 auto; padding: 0 var(--container-pad); }

    /* ============ HEADER ============ */
    .header { background: var(--neutral-0); border-bottom: 1px solid rgba(57,1,85,.06); }
    .header-inner { height: 72px; display: flex; align-items: center; }
    .header-logo { height: 32px; width: auto; display: block; }

    /* ============ HERO ============ */
    .stage {
      flex: 1; display: flex; align-items: center; padding: 72px 0;
      background:
        radial-gradient(900px 460px at 88% -12%, rgba(242,216,255,.7), transparent 62%),
        radial-gradient(720px 380px at -8% 118%, rgba(255,213,195,.4), transparent 58%),
        var(--neutral-50);
    }
    .stage-head { text-align: center; max-width: 640px; margin: 0 auto; }
    .badge-ok {
      display: inline-flex; align-items: center; gap: 8px; background: var(--success-bg); color: #0a7170;
      font-family: var(--font-accent); font-weight: 700; font-size: 14px;
      padding: 8px 16px; border-radius: var(--radius-pill); margin-bottom: 20px;
    }
    .badge-ok svg { width: 16px; height: 16px; }
    .stage-head h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 16px; }
    .stage-head p { font-size: clamp(18px, 2.1vw, 19px); color: var(--neutral-700); margin-bottom: 32px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-accent); font-weight: 700;
      font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; padding: 17px 34px;
      border-radius: var(--radius-md); background: var(--accent); color: var(--neutral-0);
      transition: background 200ms var(--ease), transform 200ms var(--ease);
    }
    .btn:hover { background: var(--accent-hover); color: var(--neutral-0); transform: translateY(-2px); }

    /* ============ FOOTER ============ */
    .footer { background: var(--primary-darker); color: rgba(255,255,255,.82); padding: 36px 0; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .footer-logo { height: 30px; width: auto; display: block; }
    .footer-meta { font-size: 14px; }

    @media (max-width: 560px) {
      .stage { padding: 52px 0; }
      .header-logo { height: 26px; }
      .footer-inner { justify-content: center; text-align: center; }
      .btn { width: 100%; justify-content: center; }
    }
    @media (max-width: 640px) {
      .badge-ok { font-size: 15px; }
      .footer-meta { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
