<!doctype html>
<!--
  OG image 1200x630 do par perpetuo-monitoramento-concorrentes (captura + tks).
  Dark premium, mesmo eixo visual do hero da captura. Render: `py render_og.py` nesta pasta.
  As duas paginas do par apontam pro mesmo arquivo (og-perpetuo-monitoramento-concorrentes.png),
  com uma copia fisica so — a excecao de OG compartilhada entre irmas da GUIDELINES 18.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-ink:#180024; --purple:#390155; --purple-deep:#26013a;
    --lilas:#F2D8FF; --laranja:#EB7C2E; --laranja-2:#ffb15a;
    --teal:#14b8b6; --text:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:
      radial-gradient(760px 420px at 88% -10%, rgba(222,36,81,.30), transparent 62%),
      radial-gradient(680px 380px at 12% 108%, rgba(20,184,182,.20), transparent 60%),
      linear-gradient(135deg, var(--purple-ink) 0%, var(--purple-deep) 58%, var(--purple) 100%);
    font-family:'League Spartan','Lato',Arial,sans-serif;
    color:var(--text);
  }
  .pill{position:absolute;border-radius:9999px}
  .ring{position:absolute;border-radius:50%}
  .dots{
    position:absolute;left:72px;bottom:132px;width:150px;height:76px;
    background-image:radial-gradient(rgba(242,216,255,.34) 2.1px, transparent 2.2px);
    background-size:19px 19px;
  }

  .logo{position:absolute;top:62px;left:72px;height:34px;width:auto}

  .badge{
    position:absolute;top:56px;right:72px;
    display:inline-flex;align-items:center;gap:12px;
    font-family:'Lato',Arial,sans-serif;font-weight:700;font-size:23px;
    color:var(--text);background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.18);
    border-radius:9999px;padding:14px 30px 15px;
  }
  .badge .dot{width:12px;height:12px;border-radius:50%;background:var(--laranja);flex:0 0 auto}

  .copy{position:absolute;left:72px;top:196px;width:1000px}
  h1{
    font-weight:800;font-size:88px;line-height:1.02;letter-spacing:-.028em;
    text-wrap:balance;
  }
  h1 .hi{color:var(--laranja)}

  .meta{
    position:absolute;left:72px;bottom:64px;
    display:flex;align-items:center;gap:18px;
    font-family:'Lato',Arial,sans-serif;font-weight:700;font-size:25px;
    color:rgba(255,255,255,.80);
  }
  .meta .sep{width:7px;height:7px;border-radius:50%;background:rgba(242,216,255,.55)}
</style>
</head>
<body>
  <span class="pill" style="width:96px;height:300px;background:var(--laranja);top:-86px;right:118px;transform:rotate(19deg)"></span>
  <span class="pill" style="width:58px;height:176px;background:rgba(242,216,255,.42);top:26px;right:246px;transform:rotate(19deg)"></span>
  <span class="ring" style="width:210px;height:210px;border:15px solid var(--teal);bottom:-96px;right:-46px"></span>
  <span class="dots"></span>

  <img class="logo" src="../../../../brand/buzzmonitor/assets/logos/logo-reversed.svg" alt="">
  <div class="badge"><span class="dot"></span>Webinar ao vivo &middot; Concorrentes</div>

  <div class="copy">
    <h1>Saiba do concorrente <span class="hi">antes do seu cliente.</span></h1>
  </div>

  <div class="meta">
    <span>Online</span><span class="sep"></span><span>Ao vivo</span><span class="sep"></span><span>25 minutos</span>
  </div>
</body>
</html>
