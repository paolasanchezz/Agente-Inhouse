<!doctype html>
<!--
  OG image 1200x630 da LP indiqueeganhe (dark Buzzmonitor).
  Renderizar:

  chrome - -headless=new - -disable-gpu - -hide-scrollbars - -window-size=1200,630 \
    - -virtual-time-budget=4000 - -screenshot="og-image.png" "file:///.../og-template-indiqueeganhe.html"

  (remover espacos nos flags acima — escritos com espaco para nao quebrar parsing de comentario)
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#390155; --lilas:#F2D8FF; --laranja:#EB7C2E; --laranja-hi:#FFD5C3;
    --teal:#0E9D9B; --teal-soft:#CDFDFC; --yellow:#FCBD4F; --text:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:linear-gradient(150deg, var(--bg) 0%, #5c1082 100%);
    font-family:'Lato',Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 90px;
  }
  .glow{position:absolute;inset:0;
    background:
      radial-gradient(ellipse 50% 46% at 92% 12%, rgba(252,189,79,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 46% 42% at 8% 96%, rgba(14,157,155,0.22) 0%, transparent 58%);
  }
  .overline{
    position:relative;display:inline-flex;align-items:center;gap:14px;
    font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--lilas);background:rgba(242,216,255,0.10);
    border:2px solid rgba(242,216,255,0.30);
    border-radius:9999px;padding:14px 32px;margin-bottom:40px;
    width:fit-content;
  }
  .overline .dot{width:14px;height:14px;border-radius:50%;background:var(--laranja)}
  h1{
    position:relative;font-family:'League Spartan',Arial,sans-serif;
    font-size:66px;font-weight:900;line-height:1.12;color:var(--text);
    letter-spacing:-1.5px;max-width:920px;
  }
  h1 .accent{color:var(--laranja)}
  .stats{position:relative;display:flex;gap:40px;margin-top:44px}
  .stat{display:flex;flex-direction:column;gap:4px}
  .stat .figure{font-family:'League Spartan',Arial,sans-serif;font-weight:900;font-size:40px;color:var(--yellow)}
  .stat .label{font-size:20px;font-weight:700;color:var(--teal-soft)}
  .brand{position:absolute;bottom:54px;right:90px;display:flex;align-items:center}
  .brand img{height:56px;width:auto}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="overline"><span class="dot"></span>Programa de indicação</div>
  <h1>Indique quem precisa da Buzzmonitor e ganhe <span class="accent">R$ 1.000</span> por isso</h1>
  <div class="stats">
    <div class="stat"><span class="figure">R$ 500</span><span class="label">por reunião</span></div>
    <div class="stat"><span class="figure">R$ 500</span><span class="label">por contrato fechado</span></div>
  </div>
  <div class="brand"><img src="../../../../brand/buzzmonitor/assets/logos/logo-reversed.svg" alt=""></div>
</body>
</html>
