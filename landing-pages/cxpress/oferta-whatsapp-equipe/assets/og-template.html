<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#ffffff; --ink:#0E1116; --blue:#2B5CE6; --blue-deep:#173FA8; --tint:#EAF0FF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:var(--bg);
    font-family:'Open Sans',Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 90px;
  }
  .pill{position:absolute;border-radius:9999px}
  .overline{
    display:inline-flex;align-items:center;gap:12px;
    font-size:24px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
    color:var(--blue-deep);background:var(--tint);
    border-radius:9999px;padding:14px 30px;margin-bottom:36px;
    width:fit-content;
  }
  .dot{width:14px;height:14px;border-radius:50%;background:var(--blue)}
  h1{font-size:66px;font-weight:800;line-height:1.12;color:var(--ink);max-width:900px;letter-spacing:-1px}
  h1 span{color:var(--blue)}
  .brand{position:absolute;bottom:56px;left:90px;display:flex;align-items:center}
  .brand img{height:56px;width:auto}
</style>
</head>
<body>
  <span class="pill" style="width:80px;height:280px;background:var(--tint);top:-60px;right:140px"></span>
  <span class="pill" style="width:56px;height:190px;border:5px solid var(--blue);bottom:-40px;right:60px"></span>
  <span class="pill" style="width:170px;height:60px;background:var(--ink);bottom:140px;right:-30px"></span>
  <div class="overline"><span class="dot"></span>Oferta exclusiva para quem participou do webinar</div>
  <h1>Sua equipe cresceu e <span>o WhatsApp ficou pequeno</span> para a operação</h1>
  <div class="brand"><img src="../../../../brand/cxpress/assets/logos/logo-primary.png" alt=""></div>
</body>
</html>
