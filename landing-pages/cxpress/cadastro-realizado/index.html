  <style>
    /* ============ TOKENS ============ */
    :root {
      --primary: #4A69BD;
      --primary-dark: #232960;
      --primary-light: #C1C7FF;
      --primary-lighter: #D7E2FF;
      --accent: #EF863C;
      --accent-light: #FFDCC3;
      --warning: #F1A908;
      --warning-light: #FFF3DA;
      --neutral-0: #ffffff;
      --neutral-100: #f5f5f5;
      --neutral-700: #4a4a4a;

      --font-heading: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;

      --container-max: 1200px;
      --container-narrow: 720px;
      --container-pad: 24px;

      --radius-pill: 9999px;
      --shadow-lg: 0 24px 60px rgba(35, 41, 96, 0.14);
      --ease: cubic-bezier(.22,.8,.22,1);
    }

    /* ============ RESET ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.6;
      color: var(--primary-dark);
      background: var(--neutral-0);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    @supports (min-height: 100dvh) { body { min-height: 100dvh; } }
    h1 { font-family: var(--font-heading); margin: 0; line-height: 1.15; }
    p { margin: 0; }
    img { max-width: 100%; display: block; }

    .skip-link {
      position: absolute; left: -9999px; top: 0;
      background: var(--primary-dark); color: var(--neutral-0);
      padding: 12px 20px; border-radius: 0 0 9px 0;
      font-family: var(--font-heading); font-weight: 700; font-size: 15px;
      z-index: 100;
    }
    .skip-link:focus { left: 0; }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--container-pad);
      width: 100%;
    }
    .container--narrow { max-width: var(--container-narrow); }

    /* ============ HEADER ============ */
    .header {
      padding: 22px 0;
      border-bottom: 1px solid rgba(35, 41, 96, 0.07);
      background: var(--neutral-0);
      position: relative;
      z-index: 2;
    }
    .header .container { display: flex; align-items: center; justify-content: center; }
    .header__logo img { height: 34px; width: auto; }

    /* ============ SECAO CONFIRMACAO ============ */
    /* Pagina de 2 linhas de copy: ocupa a altura util da janela e centraliza, em vez de
       virar uma faixa curta com o rodape colado no topo da tela. */
    main { flex: 1 0 auto; display: flex; }
    .confirmacao {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      padding: clamp(44px, 6vw, 76px) 0 clamp(52px, 7vw, 88px);
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 60%),
        linear-gradient(180deg, #FFFFFF 0%, #F7FAFF 42%, #E9F1FF 100%);
      overflow: hidden;
    }
    /* Pilulas decorativas (linguagem visual das LPs Cxpress): longe do conteudo, so textura. */
    .confirmacao::before {
      content: ""; position: absolute; pointer-events: none;
      width: 66px; height: 220px;
      background: var(--primary-lighter);
      border-radius: var(--radius-pill);
      top: -72px; right: 7%;
      opacity: .8;
    }
    .confirmacao::after {
      content: ""; position: absolute; pointer-events: none;
      width: 46px; height: 156px;
      border: 3px solid var(--accent);
      border-radius: var(--radius-pill);
      bottom: -52px; left: 5%;
      opacity: .42;
    }
    /* Em tela estreita as pilulas encostam no conteudo: encolhem e recuam pra borda. */
    @media (max-width: 720px) {
      .confirmacao::before {
        width: 50px; height: 168px; right: -26px; top: -60px; opacity: .5;
      }
      .confirmacao::after {
        width: 36px; height: 118px; left: -20px; bottom: -44px; opacity: .32;
      }
    }
    .confirmacao .container--narrow { position: relative; z-index: 1; text-align: center; }

    /* ============ MEDALHAO DO MASCOTE ============ */
    .medalhao {
      position: relative;
      width: clamp(228px, 38vw, 320px);
      aspect-ratio: 1 / 1;
      margin: 0 auto clamp(30px, 4vw, 44px);
    }
    /* A arte do mascote preenche o disco (cabeca no topo, base embaixo). Ampliada e
       ancorada embaixo: o disco recorta as pontas largas (o rabo fica de fora), mantendo
       o rosto e a joinha inteiros. */
    .medalhao__disco {
      position: absolute; inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(72% 72% at 50% 30%, #FFF4D6 0%, #FFE7AE 52%, #FFD98A 100%);
      box-shadow:
        0 0 0 1px rgba(241, 169, 8, 0.22),
        0 18px 44px rgba(35, 41, 96, 0.12);
    }
    /* Anel externo: dá acabamento ao medalhao sem pesar. */
    .medalhao::after {
      content: "";
      position: absolute; inset: -14px;
      border-radius: 50%;
      border: 1px solid rgba(241, 169, 8, 0.28);
      pointer-events: none;
    }
    .medalhao__mascote {
      position: absolute;
      left: 50%; bottom: -3%;
      transform: translateX(-50%);
      width: 108%;
      height: auto;
      min-height: 0; /* GUIDELINES §14: Safari iOS */
      filter: drop-shadow(0 12px 18px rgba(35, 41, 96, 0.18));
    }
    /* Selo de confirmacao — fica sobre o canto onde o rabo do mascote e recortado. */
    .medalhao__selo {
      position: absolute;
      left: 5%; bottom: 8%;
      width: clamp(64px, 11vw, 80px);
      height: clamp(64px, 11vw, 80px);
      border-radius: 50%;
      background: var(--neutral-0);
      display: grid; place-items: center;
      box-shadow: 0 10px 24px rgba(35, 41, 96, 0.16), 0 0 0 1px rgba(239, 134, 60, 0.18);
      color: var(--accent);
      z-index: 2;
    }
    .medalhao__selo svg { width: 54%; height: 54%; }
    .medalhao__selo path {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
    }
    .medalhao.is-visible .medalhao__selo path {
      animation: risca .55s var(--ease) .45s forwards;
    }
    @keyframes risca { to { stroke-dashoffset: 0; } }

    /* Entrada do medalhao: sobe e assenta. */
    .medalhao.reveal { transform: translateY(22px) scale(.94); }
    .medalhao.reveal.is-visible { transform: none; }

    /* ============ TEXTO ============ */
    .confirmacao h1 {
      font-size:clamp(34px, 4vw, 46px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--primary-dark);
      max-width: 15em;
      margin: 0 auto 18px;
      text-wrap: balance;
    }
    .confirmacao__sub {
      font-size: clamp(18px, 2vw, 21px);
      line-height: 1.6;
      color: var(--neutral-700);
      max-width: 30em;
      margin: 0 auto;
      text-wrap: balance;
    }

    /* ============ REVEAL ============ */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .7s var(--ease), transform .7s var(--ease);
    }
    .reveal.is-visible { opacity: 1; transform: none; }
    .reveal-delay-1 { transition-delay: .12s; }
    .reveal-delay-2 { transition-delay: .24s; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal, .medalhao.reveal { opacity: 1; transform: none; transition: none; }
      .medalhao__selo path { stroke-dashoffset: 0; }
      .medalhao.is-visible .medalhao__selo path { animation: none; }
      * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }

    /* ============ FOOTER ============ */
    .footer {
      background: var(--primary-dark);
      color: var(--primary-light);
      padding: 40px 0;
      flex: none;
    }
    .footer .container {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
    }
    .footer__logo img { display: block; height: 30px; width: auto; }
    .footer p { font-size: 15px; text-align: center; }

  /* ===== GUIDELINES 20 - pisos de tipografia mobile ===== */
  @media (max-width:640px){
  .skip-link{ font-size:16px; }
  .footer p{ font-size:16px; }
  }
</style>

  <script>
    (function () {
      // Reveal on scroll. Tres camadas de fallback (GUIDELINES §4: texto essencial nunca
      // fica invisivel esperando animacao): (1) <noscript> no <head> se JS nao roda;
      // (2) reveal imediato se o browser nao tem IntersectionObserver;
      // (3) failsafe por timeout se o IO existir mas nao disparar (aba em background no load,
      //     prerender, rendering suspenso). Depois de 1.5s tudo aparece de qualquer forma.
      var els = document.querySelectorAll('.reveal');
      function revealAll() {
        for (var i = 0; i < els.length; i++) els[i].classList.add('is-visible');
      }
      if (!('IntersectionObserver' in window)) { revealAll(); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      els.forEach(function (el) { io.observe(el); });
      setTimeout(revealAll, 1500);
    })();
  </script>
