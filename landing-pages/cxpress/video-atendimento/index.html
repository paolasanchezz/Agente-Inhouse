  <style>
    /* ============ TOKENS ============ */
    :root {
      --primary: #4A69BD;
      --primary-dark: #232960;
      --primary-darker: #1a1f4a;
      --primary-light: #C1C7FF;
      --primary-lighter: #D7E2FF;
      --accent: #EF863C;
      --accent-light: #FFDCC3;
      --neutral-0: #ffffff;
      --neutral-100: #f5f5f5;
      --neutral-300: #d1d1d1;
      --neutral-700: #4a4a4a;
      --neutral-900: #1a1a1a;

      --font-heading: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-accent: 'Bitter', Georgia, serif;

      --container-max: 1200px;
      --container-pad: 24px;

      --radius-md: 9px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-pill: 9999px;

      --shadow-md: 0 8px 24px rgba(35, 41, 96, 0.08);
      --shadow-lg: 0 24px 60px rgba(35, 41, 96, 0.14);

      --ease: cubic-bezier(.22,.8,.22,1);
    }

    /* ============ RESET ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.6;
      color: var(--primary-dark);
      background: var(--neutral-0);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    h1, h2, h3 { font-family: var(--font-heading); margin: 0; line-height: 1.15; }
    p { margin: 0; }
    img { max-width: 100%; display: block; }
    a { color: var(--primary); }

    .skip-link {
      position: absolute; left: -9999px; top: 0;
      background: var(--primary-dark); color: var(--neutral-0);
      padding: 12px 20px; border-radius: 0 0 var(--radius-md) 0;
      font-family: var(--font-heading); font-weight: 700; font-size: 15px;
      z-index: 100;
    }
    .skip-link:focus { left: 0; }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--container-pad);
    }

    /* ============ HEADER ============ */
    .header {
      padding: 22px 0;
      border-bottom: 1px solid var(--neutral-100);
      background: var(--neutral-0);
    }
    .header .container {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .header__logo img { height: 34px; width: auto; }
    .header__meta {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-heading); font-weight: 700; font-size: 13px;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--primary-dark);
      white-space: nowrap;
    }
    .header__meta .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex: none;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 134, 60, .45); }
      50% { box-shadow: 0 0 0 7px rgba(239, 134, 60, 0); }
    }
    @media (max-width: 560px) { .header__meta { display: none; } }

    /* ============ HERO / GATE ============ */
    .hero {
      position: relative;
      padding: clamp(72px, 9vw, 130px) 0 clamp(88px, 10vw, 150px);
      background: var(--neutral-0);
      overflow: hidden;
    }
    /* composicao decorativa canonica: pills empilhados */
    .hero::before, .hero::after {
      content: ""; position: absolute; pointer-events: none;
      border-radius: var(--radius-pill);
    }
    .hero::before {
      width: 74px; height: 240px;
      background: var(--primary-lighter);
      top: -70px; right: 6%;
      transform: rotate(0deg);
    }
    .hero::after {
      width: 54px; height: 170px;
      border: 10px solid var(--accent-light);
      background: transparent;
      bottom: -60px; left: 3%;
    }
    .hero .container {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
      gap: clamp(40px, 6vw, 88px);
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .hero-content .eyebrow {
      display: inline-block;
      font-family: var(--font-accent);
      font-weight: 600; font-size: 15px;
      color: var(--primary-dark);
      background: var(--primary-lighter);
      border-radius: var(--radius-pill);
      padding: 7px 18px;
      margin-bottom: 26px;
    }
    .hero-content h1 {
      font-size: clamp(34px, 4.6vw, 56px);
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--primary-dark);
      margin-bottom: 22px;
    }
    .hero-content h1 em {
      font-style: normal;
      color: var(--primary);
    }
    .hero-content .sub {
      font-size: clamp(18px, 2vw, 21px);
      font-weight: 500;
      color: var(--neutral-700);
      max-width: 30em;
    }
    .hero-content .sub strong { color: var(--primary-dark); }

    /* pill deitado sob o h1, detalhe editorial */
    .hero-content .underline-pill {
      display: block;
      width: 120px; height: 10px;
      border-radius: var(--radius-pill);
      background: var(--accent);
      margin-top: 34px;
    }

    /* ============ FORM CARD ============ */
    .form-card {
      background: var(--neutral-0);
      border: 1px solid var(--primary-lighter);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: clamp(28px, 3.4vw, 44px);
      position: relative;
    }
    .form-card::before {
      /* arco decorativo no topo do card */
      content: "";
      position: absolute;
      top: -26px; right: 34px;
      width: 52px; height: 26px;
      background: var(--accent);
      border-radius: var(--radius-pill) var(--radius-pill) 0 0;
    }
    /* ----- Jotform embed wrapper (canonico) -----
       Sem padding/background/border proprios: o provedor renderiza num iframe
       com card proprio. O .form-card ao redor perde o padding lateral pra nao
       empilhar dois cards (incidente 2026-04-30). O titulo do card tambem saiu:
       o proprio Jotform imprime o cabecalho "ASSISTA AGORA" dentro do iframe. */
    .jotform-embed { text-align: left; }
    .jotform-embed iframe { width: 100% !important; max-width: 100% !important; border: 0; display: block; }
    .form-card:has(.jotform-embed) { padding: 16px 14px 10px; }

    /* ============ REVEAL ============ */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .7s var(--ease), transform .7s var(--ease);
    }
    .reveal.is-visible { opacity: 1; transform: none; }
    .reveal-delay-1 { transition-delay: .12s; }
    .reveal-delay-2 { transition-delay: .24s; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; transition: none; }
      .header__meta .dot { animation: none; }
      * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }

    /* ============ FOOTER ============ */
    .footer {
      background: var(--primary-dark);
      color: var(--primary-light);
      padding: 44px 0;
    }
    .footer .container {
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; flex-wrap: wrap;
    }
    .footer__logo img { height: 30px; width: auto; }
    .footer p { font-size: 15px; }

    /* ============ RESPONSIVO ============ */
    @media (max-width: 980px) {
      .hero .container { grid-template-columns: 1fr; }
      .hero-content { text-align: left; }
      .hero::before { right: -30px; }
    }

  /* ===== GUIDELINES 20 - pisos de tipografia mobile ===== */
  @media (max-width:640px){
  .skip-link{ font-size:16px; }
  .hero-content .eyebrow{ font-size:16px; }
  .footer p{ font-size:16px; }
  }
</style>

  <script>
    (function () {
      // Destino pos-envio desta LP (landing-pages/GUIA-webinar-perpetuo-destino.md §2.1)
      var slot = document.querySelector('[data-perpetuo-next]');
      if (slot) {
        try {
          sessionStorage.setItem('bmPerpetuoNext', JSON.stringify({ to: slot.getAttribute('data-perpetuo-next'), at: Date.now() }));
        } catch (e) { /* sessionStorage bloqueado: cai no destino padrao do Jotform */ }
      }
    })();
    (function () {
      // Reveal on scroll. Tres camadas de fallback (GUIDELINES §4: texto essencial nunca
      // fica invisivel esperando animacao): (1) <noscript> no <head> se JS nao roda;
      // (2) reveal imediato se o browser nao tem IntersectionObserver;
      // (3) failsafe por timeout se o IO existir mas nao disparar (aba em background no load,
      //     prerender, rendering suspenso). Depois de 1.5s tudo aparece de qualquer forma.
      var els = document.querySelectorAll('.reveal');
      function revealAll() {
        for (var i = 0; i < els.length; i++) els[i].classList.add('is-visible');
      }
      if (!('IntersectionObserver' in window)) { revealAll(); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      els.forEach(function (el) { io.observe(el); });
      setTimeout(revealAll, 1500);

      // O redirect pos-envio nao vive aqui: o Jotform renderiza o form num iframe de
      // outra origem, entao quem manda o lead pra thanks page e a propria configuracao
      // do form (Configuracoes > Apos o envio > Redirecionar para link externo:
      // https://content.cxpress.io/video-atendimento-obrigado).
    })();
  </script>
