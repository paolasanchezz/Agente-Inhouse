<style>
  :root{--bg:#ffffff;--primary:#4A69BD;--dark:#232960;--lighter:#D7E2FF;--accent:#EF863C;--peach:#FFDCC3;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;background:var(--bg);
    font-family:'Open Sans',Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 90px 120px}
  .arc{position:absolute;right:-120px;top:-40px;width:520px;height:700px;background:var(--lighter);
    border-radius:9999px 9999px 28px 28px;opacity:.6}
  .pill{position:absolute;border-radius:9999px}
  .overline{display:inline-flex;align-items:center;gap:12px;font-size:24px;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;color:var(--dark);background:var(--lighter);
    border-radius:9999px;padding:13px 28px;margin-bottom:34px;width:fit-content;position:relative;z-index:3}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
  h1{font-size:64px;font-weight:800;line-height:1.1;color:var(--dark);max-width:680px;
    letter-spacing:-1.5px;text-wrap:balance;position:relative;z-index:3}
  .brand{position:absolute;bottom:54px;left:90px;display:flex;align-items:center;z-index:3}
  .brand img{height:56px;width:auto}
  .mascot{position:absolute;right:56px;bottom:0;height:430px;width:auto;z-index:2;
    filter:drop-shadow(0 20px 30px rgba(35,41,96,.18))}
</style>
