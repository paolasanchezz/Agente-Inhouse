<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não disponível | Cxpress</title>
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root{--ink:#0E1116;--ink-mute:#697280;--blue:#2B5CE6;--rule:#E4E7EC}

    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;

    main{max-width:34rem}
    h1{font-size:clamp(24px,4vw,32px);line-height:1.2;letter-spacing:-.02em;margin:0 0 14px}
    p{margin:0 0 26px;font-size:17px;line-height:1.6;color:var(--ink-mute)}
    a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;
      font-weight:600;padding:13px 22px;border-radius:10px}
  </style>
</head>
<body>
  <main>
    <h1>Esta página não está disponível</h1>
