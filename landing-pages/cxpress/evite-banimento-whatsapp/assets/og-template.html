<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1200px; height:630px; overflow:hidden; }
  .og{ position:relative; width:1200px; height:630px; overflow:hidden;
       background:#ffffff; font-family:"Source Sans 3",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased; }

  /* Formas de apoio: mesma linguagem do hero da LP (pilulas solidas + contorno) */
  .deco span{ position:absolute; display:block; }
  .d1{ width:92px; height:215px; border-radius:0 0 46px 46px; background:#D7E2FF; top:0; right:130px; }
  .d2{ width:140px; height:72px; border-radius:9999px; background:#F1A908; top:418px; right:0; }
  .d3{ width:60px; height:150px; border-radius:9999px; border:6px solid #EF863C; bottom:-42px; right:78px; }

  .content{ position:absolute; z-index:2; left:90px; top:0; height:100%;
            display:flex; flex-direction:column; justify-content:center; max-width:880px; padding-bottom:96px; }
  .badge{ display:inline-flex; align-items:center; gap:12px; align-self:flex-start;
          background:#D7E2FF; color:#232960; font-family:"Open Sans",sans-serif; font-weight:800;
          font-size:24px; letter-spacing:.03em; text-transform:uppercase;
          padding:14px 30px; border-radius:9999px; margin-bottom:34px; }
  .badge::before{ content:""; width:14px; height:14px; border-radius:50%; background:#EF863C; }
  .title{ font-family:"Open Sans",sans-serif; font-weight:800; font-size:66px; line-height:1.1;
          letter-spacing:-.025em; color:#232960; text-wrap:balance; }
  .sub{ margin-top:22px; font-size:30px; line-height:1.42; color:#3d4250; max-width:720px; text-wrap:balance; }
  .logo{ position:absolute; z-index:2; left:92px; bottom:56px; height:54px; }
</style>
</head>
<body>
<div class="og">
  <div class="deco" aria-hidden="true">
    <span class="d1"></span><span class="d2"></span><span class="d3"></span>
  </div>
  <div class="content">
    <span class="badge">API oficial do WhatsApp &middot; Cxpress</span>
    <div class="title">WhatsApp bloqueado ou banido?</div>
    <div class="sub">Reduza o risco de banimento na sua opera&ccedil;&atilde;o com a API Oficial do WhatsApp.</div>
  </div>
  <img class="logo" src="../../../../brand/cxpress/assets/logos/logo-primary.png" alt="Cxpress">
</div>
</body>
</html>
