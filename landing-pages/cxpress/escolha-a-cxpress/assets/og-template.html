<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700;800&family=Source+Sans+3:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1200px; height:630px; overflow:hidden; }
  .og{ position:relative; width:1200px; height:630px; overflow:hidden;
    background:linear-gradient(150deg,#4A69BD 0%,#232960 72%);
    font-family:"Source Sans 3",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .deco{ position:absolute; inset:0; z-index:0; }
  .content{ position:absolute; z-index:2; left:80px; top:0; height:100%;
    display:flex; flex-direction:column; justify-content:center; max-width:700px; }
  .badge{ display:inline-flex; align-items:center; gap:10px; align-self:flex-start;
    background:#EF863C; color:#232960; font-family:"Open Sans",sans-serif; font-weight:800;
    font-size:19px; letter-spacing:.08em; text-transform:uppercase; padding:10px 22px; border-radius:9999px; margin-bottom:30px; }
  .title{ font-family:"Open Sans",sans-serif; font-weight:800; font-size:72px; line-height:1.03; letter-spacing:-.03em; color:#fff; }
  .title span{ color:#F1A908; }
  .sub{ margin-top:26px; font-size:29px; line-height:1.35; color:rgba(255,255,255,.9); font-weight:500; max-width:640px; }
  .pill{ margin-top:38px; display:inline-flex; align-self:flex-start; align-items:center; gap:15px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); border-radius:9999px;
    padding:14px 30px; color:#fff; font-family:"Open Sans",sans-serif; font-weight:700; font-size:23px; }
  .pill .sep{ width:6px; height:6px; background:#EF863C; border-radius:50%; }
  .logo{ position:absolute; z-index:2; right:70px; bottom:56px; height:44px; }
</style>
</head>
<body>
<div class="og">
  <svg class="deco" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="1075" cy="120" r="330" fill="rgba(255,255,255,.05)"/>
    <rect x="880" y="230" width="290" height="230" rx="18" fill="rgba(255,255,255,.07)"/>
    <rect x="880" y="230" width="96" height="230" rx="18" fill="rgba(255,255,255,.13)"/>
    <circle cx="928" cy="292" r="15" fill="#fff"/>
    <circle cx="928" cy="350" r="15" fill="#fff"/>
    <circle cx="928" cy="408" r="15" fill="#fff"/>
    <circle cx="1024" cy="292" r="15" fill="rgba(255,255,255,.42)"/>
    <circle cx="1024" cy="350" r="15" fill="rgba(241,169,8,.85)"/>
    <circle cx="1024" cy="408" r="15" fill="rgba(255,255,255,.42)"/>
    <circle cx="1120" cy="292" r="15" fill="rgba(241,169,8,.85)"/>
    <circle cx="1120" cy="350" r="15" fill="rgba(255,255,255,.42)"/>
    <circle cx="1120" cy="408" r="15" fill="rgba(255,255,255,.28)"/>
    <rect x="880" y="505" width="290" height="14" rx="7" fill="rgba(239,134,60,.55)"/>
  </svg>
  <div class="content">
    <span class="badge">Compare antes de contratar</span>
    <div class="title">As funcionalidades s&atilde;o parecidas. <span>As experi&ecirc;ncias n&atilde;o.</span></div>
    <div class="sub">Canais, custo, suporte, onboarding e IA: veja o que muda na opera&ccedil;&atilde;o antes de escolher sua plataforma.</div>
    <div class="pill">Cxpress <span class="sep"></span> ZNV <span class="sep"></span> ZDK <span class="sep"></span> OCD <span class="sep"></span> CHG</div>
  </div>
  <img class="logo" src="../../../../brand/cxpress/assets/logos/logo-reversed.png" alt="Cxpress">
</div>
</body>
</html>
