  <script>
    (function () {
      try {
        var raw = sessionStorage.getItem('bmPerpetuoNext');
        if (!raw) return;
        sessionStorage.removeItem('bmPerpetuoNext');
        var d = JSON.parse(raw);
        if (!d || typeof d.to !== 'string') return;
        if (d.to.charAt(0) !== '/' || d.to.charAt(1) === '/') return;  // so caminho interno
        if (Date.now() - (d.at || 0) > 1800000) return;                // vale 30 min
        var norm = function (p) { return p.replace(/\/+$/, ''); };
        if (norm(d.to) === norm(location.pathname)) return;            // ja e aqui
        location.replace(d.to);
      } catch (e) { /* sem sessionStorage: segue nesta pagina */ }
    })();
  </script>

    /* ============ TOKENS ============ */
    :root {
      --primary: #4A69BD;
      --primary-dark: #232960;
      --primary-darker: #1a1f4a;
      --primary-light: #C1C7FF;
      --primary-lighter: #D7E2FF;

      --accent-light: #FFDCC3;
      --neutral-0: #ffffff;
      --neutral-100: #f5f5f5;

      --font-heading: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-accent: 'Bitter', Georgia, serif;

      --container-max: 1200px;
      --container-narrow: 920px;
      --container-pad: 24px;

      --radius-md: 9px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-pill: 9999px;

      --shadow-md: 0 8px 24px rgba(35, 41, 96, 0.08);
      --shadow-lg: 0 24px 60px rgba(35, 41, 96, 0.14);

      --ease: cubic-bezier(.22,.8,.22,1);
    }

    /* ============ RESET ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.6;
      color: var(--primary-dark);
      background: var(--neutral-0);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    h1, h2 { font-family: var(--font-heading); margin: 0; line-height: 1.15; }
    p { margin: 0; }
    img { max-width: 100%; display: block; }
    a { color: var(--primary); }

    .skip-link {
      position: absolute; left: -9999px; top: 0;
      background: var(--primary-dark); color: var(--neutral-0);
      padding: 12px 20px; border-radius: 0 0 var(--radius-md) 0;
      font-family: var(--font-heading); font-weight: 700; font-size: 15px;
      z-index: 100;
    }
    .skip-link:focus { left: 0; }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--container-pad);
    }
    .container--narrow { max-width: var(--container-narrow); }

    /* ============ HEADER ============ */
    .header {
      padding: 22px 0;
      border-bottom: 1px solid var(--neutral-100);
      background: var(--neutral-0);
    }
    .header .container {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .header__logo img { height: 34px; width: auto; }
    .header__meta {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-heading); font-weight: 700; font-size: 13px;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--primary-dark);
      white-space: nowrap;
    }
    .header__meta .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex: none;
    }
    @media (max-width: 560px) { .header__meta { display: none; } }

    /* ============ SECAO VIDEO ============ */
    .video-hero {
      position: relative;
      padding: clamp(64px, 8vw, 110px) 0 clamp(80px, 9vw, 130px);
      background: var(--neutral-0);
      overflow: hidden;
    }
    .video-hero::before {
      content: ""; position: absolute; pointer-events: none;
      width: 66px; height: 210px;
      background: var(--primary-lighter);
      border-radius: var(--radius-pill);
      top: -60px; right: 5%;
    }
    .video-hero .container--narrow { position: relative; z-index: 1; text-align: center; }

    .video-hero .eyebrow {
      display: inline-block;
      font-family: var(--font-accent);
      font-weight: 600; font-size: 15px;
      color: var(--primary-dark);
      background: var(--accent-light);
      border-radius: var(--radius-pill);
      padding: 7px 18px;
      margin-bottom: 24px;
    }
    .video-hero h1 {
      font-size:clamp(34px, 3.8vw, 44px);
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--primary-dark);
      max-width: 21em;
      margin: 0 auto clamp(36px, 4.6vw, 56px);
    }

    .video-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      background: var(--primary-darker);
    }
    .video-frame iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    /* ============ CTA FINAL ============ */
    .cta-final {
      background: var(--neutral-100);
      padding: clamp(72px, 9vw, 120px) 0;
    }
    .cta-final .container--narrow { text-align: center; }
    /* Sem titulo na secao: esta linha carrega a mensagem, por isso pesa mais que
       um texto de apoio comum (maior, na cor de titulo, semibold). */
    .cta-final p {
      font-size:clamp(22px, 2.2vw, 25px);
      font-weight: 600;
      line-height: 1.35;
      color: var(--primary-dark);
      max-width: 30em;
      margin: 0 auto 34px;
      text-wrap: balance;
    }
    .cta-whatsapp {
      display: inline-flex; align-items: center; gap: 12px;
      font-family: var(--font-heading);
      font-weight: 700; font-size: 17px;
      color: var(--neutral-0);
      background: var(--primary-dark);
      border-radius: var(--radius-md);
      padding: 16px 32px;
      text-decoration: none;
      text-align: center;
      text-wrap: balance;
      transition: background .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
    }
    /* CTA longo ("Agende uma demonstracao gratuita") nao cabe em 1 linha no mobile:
       menos padding lateral e fonte levemente menor deixam a quebra em 2 linhas equilibradas. */
    @media (max-width: 560px) {

    }
    .cta-whatsapp:hover {
      background: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .cta-whatsapp:active { transform: translateY(0); }
    .cta-whatsapp svg { flex: none; }

    /* ============ REVEAL ============ */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .7s var(--ease), transform .7s var(--ease);
    }
    .reveal.is-visible { opacity: 1; transform: none; }
    .reveal-delay-1 { transition-delay: .12s; }
    .reveal-delay-2 { transition-delay: .24s; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; transition: none; }

    /* ============ FOOTER ============ */

  <script>
    (function () {
      // Reveal on scroll. Tres camadas de fallback (GUIDELINES §4: texto essencial nunca
      // fica invisivel esperando animacao): (1) <noscript> no <head> se JS nao roda;
      // (2) reveal imediato se o browser nao tem IntersectionObserver;
      // (3) failsafe por timeout se o IO existir mas nao disparar (aba em background no load,
      //     prerender, rendering suspenso). Depois de 1.5s tudo aparece de qualquer forma.
      var els = document.querySelectorAll('.reveal');
      function revealAll() {
        for (var i = 0; i < els.length; i++) els[i].classList.add('is-visible');
      }
      if (!('IntersectionObserver' in window)) { revealAll(); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      els.forEach(function (el) { io.observe(el); });
      setTimeout(revealAll, 1500);
    })();
  </script>
