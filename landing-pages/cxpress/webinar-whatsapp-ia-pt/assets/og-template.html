<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700;800&family=Source+Sans+3:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1200px; height:630px; overflow:hidden; }
  .og{ position:relative; width:1200px; height:630px; overflow:hidden;
    background:linear-gradient(150deg,#4A69BD 0%,#232960 72%);
    font-family:"Source Sans 3",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .deco{ position:absolute; inset:0; z-index:0; }
  .content{ position:absolute; z-index:2; left:80px; top:0; height:100%;
    display:flex; flex-direction:column; justify-content:center; max-width:880px; }
  .badge{ display:inline-flex; align-items:center; gap:10px; align-self:flex-start;
    background:#EF863C; color:#fff; font-family:"Open Sans",sans-serif; font-weight:800;
    font-size:20px; letter-spacing:.06em; text-transform:uppercase; padding:10px 22px; border-radius:9999px; margin-bottom:28px; }
  .title{ font-family:"Open Sans",sans-serif; font-weight:800; font-size:64px; line-height:1.05; letter-spacing:-.03em; color:#fff; }
  .title mark{ background:none; color:#F1A908; }
  .sub{ margin-top:24px; font-size:29px; line-height:1.35; color:rgba(255,255,255,.9); font-weight:500; max-width:760px; }
  .pill{ margin-top:36px; display:inline-flex; align-self:flex-start; align-items:center; gap:16px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); border-radius:9999px;
    padding:14px 30px; color:#fff; font-family:"Open Sans",sans-serif; font-weight:700; font-size:23px; }
  .pill .sep{ width:6px; height:6px; background:#EF863C; border-radius:50%; }
  .logo{ position:absolute; z-index:2; right:70px; bottom:56px; height:44px; }
</style>
</head>
<body>
<div class="og">
  <svg class="deco" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="1040" cy="150" r="360" fill="rgba(255,255,255,.05)"/>
    <path d="M980 560 q120 -60 220 -20" stroke="rgba(239,134,60,.5)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="900" y="300" width="330" height="120" rx="16" fill="rgba(255,255,255,.06)"/>
    <path d="M930 390 l40 -34 l40 20 l50 -46 l44 24" stroke="rgba(255,255,255,.5)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="content">
    <span class="badge">Aula gratuita · 10 min</span>
    <div class="title">Transforme o WhatsApp num canal de vendas <mark>24/7</mark></div>
    <div class="sub">Com a API Oficial da Meta e IA, sem trocar o número que os seus clientes já conhecem.</div>
    <div class="pill">Online <span class="sep"></span> 10 min <span class="sep"></span> Cxpress</div>
  </div>
  <img class="logo" src="../../../../brand/cxpress/assets/logos/logo-reversed.png" alt="Cxpress">
</div>
</body>
</html>
