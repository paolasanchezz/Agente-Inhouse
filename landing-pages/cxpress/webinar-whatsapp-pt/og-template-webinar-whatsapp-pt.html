<!doctype html>
<!--
  Template da OG image (1200x630) da LP cxpress/webinar-whatsapp-pt.
  Render (remover os espacos nos flags):
  chrome - -headless=new - -disable-gpu - -hide-scrollbars - -window-size=1200,630 \
    - -virtual-time-budget=4000 - -screenshot="assets/og-webinar-whatsapp-pt.png" \
    "file:///.../og-template-webinar-whatsapp-pt.html"
-->
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700;800&display=swap">
<style>
  :root{
    --bg:#ffffff; --primary:#4A69BD; --dark:#232960; --lighter:#D7E2FF;
    --accent:#EF863C; --warning:#F1A908;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:var(--bg);
    font-family:'Open Sans',Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 90px;
  }
  .pill{position:absolute;border-radius:9999px}
  .overline{
    display:inline-flex;align-items:center;gap:12px;
    font-size:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--dark);background:var(--lighter);
    border-radius:9999px;padding:13px 28px;margin-bottom:32px;
    width:fit-content;
  }
  .dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
  h1{font-size:64px;font-weight:800;line-height:1.1;color:var(--dark);max-width:860px;letter-spacing:-1.4px}
  h1 .mark{position:relative;display:inline-block;white-space:nowrap}
  h1 .mark::after{
    content:'';position:absolute;left:-2px;right:-2px;bottom:6px;height:16px;
    background:var(--accent);opacity:.3;z-index:-1;border-radius:3px;
  }
  .sub{margin-top:26px;font-size:27px;font-weight:700;color:var(--primary);max-width:820px}
  .brand{position:absolute;bottom:52px;left:90px;display:flex;align-items:center}
  .brand img{height:58px;width:auto}
</style>
</head>
<body>
  <span class="pill" style="width:80px;height:280px;background:var(--lighter);top:-60px;right:140px"></span>
  <span class="pill" style="width:56px;height:190px;border:5px solid var(--accent);bottom:-40px;right:60px"></span>
  <span class="pill" style="width:170px;height:60px;background:var(--warning);bottom:150px;right:-30px"></span>
  <div class="overline"><span class="dot"></span>Webinar gratuito · 10 minutos</div>
  <h1 style="isolation:isolate">O número de WhatsApp da sua empresa pode ser <span class="mark">bloqueado amanhã.</span></h1>
  <div class="sub">API Oficial da Meta, sem trocar o número.</div>
  <div class="brand"><img src="../../../brand/cxpress/assets/logos/logo-primary.png" alt=""></div>
</body>
</html>
