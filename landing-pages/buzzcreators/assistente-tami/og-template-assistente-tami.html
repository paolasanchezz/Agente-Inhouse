<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{ --plum:#3a1652; --night:#1d0a2b; --tami:#F05A28; --tami-ink:#B8340F; --tami-soft:#FFE6DC; --text-3:#5f6368; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{ width:1200px; height:630px; overflow:hidden; position:relative; background:var(--night); font-family:'DM Sans',system-ui,sans-serif; color:#fff; }
  .aurora{ position:absolute; inset:0; overflow:hidden; }
  .mesh{ position:absolute; inset:0; filter:blur(40px); background:
      linear-gradient(118deg, rgba(29,10,43,0) 16%, rgba(106,56,149,.95) 40%, rgba(29,10,43,0) 64%),
      linear-gradient(205deg, rgba(29,10,43,0) 26%, rgba(240,90,40,.9) 54%, rgba(255,129,25,.8) 70%, rgba(29,10,43,0) 90%),
      linear-gradient(80deg, rgba(58,22,82,.9) 0%, rgba(58,22,82,0) 45%); }
  .ribbon{ position:absolute; filter:blur(70px); }
  .r1{ width:1200px; height:300px; left:200px; top:-150px; opacity:.9; background:linear-gradient(100deg,#3a1652 0%,#6a3895 48%,#D2401C 100%); border-radius:42% 58% 63% 37% / 46% 38% 62% 54%; transform:rotate(-14deg); }
  .r2{ width:760px; height:480px; right:-300px; bottom:-200px; opacity:.95; background:linear-gradient(160deg,#F05A28 0%,#ff8119 62%); border-radius:63% 37% 41% 59% / 52% 61% 39% 48%; transform:rotate(16deg); }
  .r3{ width:520px; height:420px; right:60px; top:110px; opacity:.85; background:linear-gradient(150deg,#6a3895 0%,#4a1d6a 58%,#D2401C 100%); border-radius:37% 63% 55% 45% / 58% 42% 58% 42%; transform:rotate(-6deg); }
  .grain{ position:absolute; inset:0; opacity:.22; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .shade{ position:absolute; inset:0; background:linear-gradient(90deg, rgba(29,10,43,.85) 0%, rgba(29,10,43,.5) 40%, rgba(29,10,43,0) 66%); }
  .copy{ position:absolute; left:80px; top:92px; width:640px; }
  .overline{ display:inline-flex; align-items:center; gap:12px; padding:10px 20px 10px 16px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); font-size:18px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; }
  .dot{ width:12px; height:12px; border-radius:50%; background:var(--tami); box-shadow:0 0 0 6px rgba(240,90,40,.22); }
  h1{ margin-top:30px; font-size:96px; line-height:.96; font-weight:700; letter-spacing:-.045em; }
  h1 span{ display:block; background:linear-gradient(90deg,#FFD3C2 0%,#FFB27A 55%,#FF9A6B 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.06em; }
  .sub{ margin-top:24px; font-size:26px; line-height:1.4; color:rgba(255,255,255,.84); max-width:600px; text-wrap:balance; }
  .sub b{ color:#fff; }
  .brand{ position:absolute; left:80px; bottom:52px; display:flex; align-items:center; gap:22px; }
  .brand img{ height:30px; width:auto; }
  .brand .sep{ width:1px; height:30px; background:rgba(255,255,255,.3); }
  .brand .bm{ display:inline-flex; align-items:center; gap:10px; font-size:17px; color:rgba(255,255,255,.8); }
  .brand .bm i{ width:10px; height:10px; border-radius:50%; background:var(--tami); }
  .visual{ position:absolute; right:30px; top:40px; width:480px; height:590px; }
  .visual img{ position:absolute; right:20px; bottom:0; height:540px; width:auto; filter:drop-shadow(0 26px 34px rgba(12,2,22,.5)); }
  .pill{ position:absolute; left:24px; bottom:64px; display:inline-flex; align-items:center; gap:10px; background:rgba(255,255,255,.94); color:var(--plum); border-radius:999px; padding:14px 22px; font-size:20px; font-weight:700; box-shadow:0 22px 44px -18px rgba(12,2,22,.6); }
  .pill i{ width:22px; height:22px; border-radius:50%; background:var(--tami-soft); color:var(--tami-ink); display:grid; place-items:center; font-style:normal; font-size:14px; }
</style>
</head>
<body>
  <div class="aurora"><span class="mesh"></span><span class="ribbon r1"></span><span class="ribbon r3"></span><span class="ribbon r2"></span><span class="grain"></span><span class="shade"></span></div>
  <div class="copy">
    <p class="overline"><span class="dot"></span>Beta · Real-time marketing</p>
    <h1>Do post <span>ao contrato.</span></h1>
    <p class="sub"><b>Tami, o assistente de marketing em tempo real do Buzzcreators.</b> Trabalha 24/7 para a sua marca.</p>
  </div>
  <div class="brand">
    <img src="../../brand/buzzcreators/assets/logos/logo-branca-2.svg" alt="">
    <span class="sep"></span>
    <span class="bm"><i></i>Escuta em tempo real com Buzzmonitor</span>
  </div>
  <div class="visual">
    <img src="./assets/tami.webp" alt="">
    <span class="pill"><i>✓</i>Negociação · proposta dentro do teto</span>
  </div>
</body>
</html>
