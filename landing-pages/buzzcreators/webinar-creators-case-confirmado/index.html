  <style>
    :root {
      --primary-dark: #3a1652;
      --primary-darker: #2c1040;
      --primary: #6a3895;
      --primary-hover: #55297a;
      --neutral-0: #ffffff;
      --neutral-100: #f7f9fb;
      --neutral-200: #eaeef1;
      --neutral-700: #4a4a4a;
      --neutral-900: #1a1a1a;
      --font: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-md: 0 4px 12px rgba(58,22,82,.08);
      --shadow-lg: 0 10px 30px rgba(58,22,82,.14);
      --container: 980px;
      --ease: cubic-bezier(.22,.8,.22,1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: var(--font); font-size: 17px; line-height: 1.6; color: var(--neutral-900); background: #fff; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4 { color: var(--primary-dark); margin: 0; line-height: 1.15; letter-spacing: -.02em; }
    p { margin: 0; }
    img { max-width: 100%; display: block; }
    a { color: var(--primary); }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
    [hidden] { display: none !important; }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1 0 auto; background: var(--neutral-100); } main > .top { min-height: 100%; }

    h1, h2, h3, h4, .confirm p, .chips li, .stat-label, .video-end-title { text-wrap: balance; }
    .item-body, .card-body, .question p { text-wrap: pretty; }

    .skip-link { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--primary-dark); color: #fff; padding: 12px 18px; border-radius: var(--radius-sm); font-weight: 700; }
    .skip-link:focus-visible { left: 12px; }
    .container { width: 100%; max-width: var(--container); margin: 0 auto; padding: 0 20px; }
    .section { padding: 80px 0; }
    .section--alt { background: var(--neutral-100); }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); }
    .eyebrow::before { content: ""; width: 20px; height: 3px; border-radius: 2px; background: var(--primary); }
    .h2 { font-size: clamp(28px, 3.6vw, 40px); font-weight: 800; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 15px 26px;
      border-radius: var(--radius-sm); background: var(--primary); color: #fff; border: 2px solid var(--primary);
      font: 700 17px/1.2 var(--font); text-decoration: none; cursor: pointer; transition: background 200ms var(--ease), transform 200ms var(--ease);
    }
    .btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; transform: translateY(-1px); }
    .btn .arrow { color: currentColor; font-size: 1.15em; line-height: 1; }
    .btn--ghost { background: #fff; color: var(--primary); }
    .btn--ghost:hover { background: var(--neutral-100); color: var(--primary-dark); border-color: var(--primary); }

    .header { border-bottom: 1px solid var(--neutral-200); background: #fff; }
    .header-inner { height: 68px; display: flex; align-items: center; }
    .header-logo { height: 28px; width: auto; }

    /* ============ CONFIRMACAO + VIDEO ============ */
    .top { padding: 32px 0 64px; background: var(--neutral-100); }
    .confirm { text-align: center; margin-bottom: 24px; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: #fff; border: 1px solid var(--neutral-200); color: var(--primary-dark); font-size: 14px; font-weight: 700; margin-bottom: 14px; white-space: nowrap; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px rgba(106,56,149,.18); }
    .confirm-ok { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 12px !important; padding: 6px 14px; border-radius: 999px; background: #fff; border: 1px solid var(--neutral-200); color: var(--primary-dark) !important; font-size: 15px !important; font-weight: 700; }
    .ok-icon { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 12px; line-height: 1; }
    .confirm h1 { font-size: clamp(28px, 3.6vw, 40px); font-weight: 800; max-width: 900px; margin: 0 auto; }
    .confirm p { color: var(--neutral-700); font-size: clamp(18px, 1.8vw, 19px); margin-top: 8px; }
    .confirm p strong { color: var(--primary); }

    .video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius-md); overflow: hidden; background: var(--primary-dark); box-shadow: var(--shadow-lg); border: 3px solid #fff; }
    @supports not (aspect-ratio: 16 / 9) { .video-wrap { height: 0; padding-top: 56.25%; } }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #player { position: absolute; inset: 0; }
    .video-loading { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.8); font-size: 15px; }
    .video-sound {
      position: absolute; inset: 0; z-index: 2; border: 0; margin: 0; padding: 0 0 8%; cursor: pointer; font: inherit;
      background: linear-gradient(180deg, rgba(58,22,82,0) 55%, rgba(58,22,82,.55) 100%);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .video-sound-pill {
      display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border-radius: 999px;
      background: var(--primary); color: #fff; font-weight: 800; font-size: clamp(15px, 2.4vw, 17px); box-shadow: 0 8px 24px rgba(0,0,0,.3); border: 2px solid #fff;

    .video-sound-pill svg { width: 20px; height: 20px; }
    .video-sound:hover .video-sound-pill { background: var(--primary-hover); }
    @media (prefers-reduced-motion: no-preference) {
      .video-sound-pill { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    }
    .video-end { position: absolute; inset: 0; z-index: 3; background: var(--primary-dark); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; text-align: center; }

    .cta-end { display: flex; justify-content: center; margin-top: 32px; }
    .chips-wrap { text-align: center; margin-top: 26px; }
    .chips-title { font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; }

    /* ============ RESUMO ============ */
    .base { margin-top: 28px; padding: 20px 22px; background: var(--neutral-100); border-radius: var(--radius-md); border-left: 4px solid var(--primary); }
    .base h3 { font-size: clamp(22px, 2.2vw, 24px); }

    .items { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 14px; }
    .items li { display: flex; gap: 14px; align-items: flex-start; padding: 20px; background: #fff; border: 1px solid var(--neutral-200); border-radius: var(--radius-md); box-shadow: var(--shadow-md); }
    .items .n { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: #fff; font-weight: 800; }
    .items h3 { font-size: clamp(22px, 2vw, 22px); }
    .item-body { color: var(--neutral-700); margin-top: 6px; }

    /* ============ NUMEROS (unica secao escura) ============ */
    .stats { padding: 48px 0; background: var(--primary-dark); }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat { text-align: center; color: #fff; }
    .stat-num { display: block; font-size: clamp(34px, 5vw, 52px); font-weight: 800; line-height: 1; }
    .stat-num::after { content: ""; display: block; width: 26px; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; margin: 10px auto 8px; }
    .stat-label { display: block; font-size: 15px; color: rgba(255,255,255,.82); }

    /* ============ PERGUNTA + CONHECA ============ */
    .question { text-align: center; }
    .question h2 { max-width: 760px; margin: 0 auto; }
    .question > .container > p { color: var(--neutral-700); max-width: 640px; margin: 16px auto 0; }
    .know-title { font-size: clamp(22px, 2.4vw, 24px); margin: 48px auto 20px; max-width: 560px; }
    .know { display: grid; gap: 16px; text-align: left; }
    .know-card { display: flex; flex-direction: column; padding: 26px; background: #fff; border: 1px solid var(--neutral-200); border-radius: var(--radius-md); box-shadow: var(--shadow-md); }
    .know-card h3 { font-size: clamp(22px, 2.2vw, 24px); }
    .card-body { color: var(--neutral-700); margin: 8px 0 20px; }
    .know-card .btn { margin-top: auto; width: 100%; }

    .footer { padding: 28px 0; background: var(--primary-darker); color: rgba(255,255,255,.82); font-size: 14px; }
    .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
    .footer-logo { height: 26px; width: auto; filter: brightness(0) invert(1); }
    .footer a { color: rgba(255,255,255,.82); }
    .footer a:hover { color: #fff; }
    .social { list-style: none; margin: 0; padding: 0; display: flex; gap: 10px; }
    .social a {
      display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); transition: background 200ms var(--ease), color 200ms var(--ease);

    .social a:hover { background: #fff; color: var(--primary-dark); border-color: #fff; }
    .social svg { width: 18px; height: 18px; }

    @media (min-width: 640px) {

      .know { grid-template-columns: 1fr 1fr; }
      .footer-inner { flex-direction: row; justify-content: space-between; }
    }
    @media (min-width: 981px) {
      .section { padding: 112px 0; }
      .top { padding: 48px 0 72px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  <script>
    (function () {
      'use strict';

      // ===== Configuracao do video =====
      var VIDEO_ID = 'kR0Iq1bFWLc';
      var VIDEO_START = 180; // pula a contagem regressiva; a fala comeca em 3:00
      var VIDEO_TITLE = 'Webinar Buzzcreators: vendedores que viram creators e vendem 3x mais';
      var STORAGE_KEY = 'bcWebinarCreatorsCase';

      // 1) Primeiro nome (so com o form mock; com o Jotform cai na versao generica)
      try {
        var raw = sessionStorage.getItem(STORAGE_KEY);
        var data = raw ? JSON.parse(raw) : null;
        var nome = data && typeof data.nome === 'string' ? data.nome.trim() : '';
        if (nome) document.getElementById('confirm-ok-text').textContent = 'Pronto, ' + nome + '! Seu acesso foi liberado';
      } catch (e) {}

      // 2) Player com autoplay inline (no mudo, regra dos navegadores) + botao de som
      var wrap = document.getElementById('video-wrap');
      var btnSound = document.getElementById('video-sound');
      var endScreen = document.getElementById('video-end');

      function removeLoading() { var l = wrap.querySelector('.video-loading'); if (l) l.remove(); }

      // CSP do guarda-chuva (vercel.json): frame-src libera so www.youtube.com e script-src NAO libera
      // o iframe_api. Por isso: iframe direto em www.youtube.com/embed com enablejsapi=1 e controle via
      // postMessage (protocolo do proprio player), sem carregar script do YouTube.
      var PLAYER_VARS = { autoplay: 1, mute: 1, start: VIDEO_START, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, enablejsapi: 1 };
      if (location.origin && location.origin !== 'null') PLAYER_VARS.origin = location.origin;
      var qs = Object.keys(PLAYER_VARS).map(function (k) { return k + '=' + encodeURIComponent(PLAYER_VARS[k]); }).join('&');

      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube.com/embed/' + encodeURIComponent(VIDEO_ID) + '?' + qs;
      iframe.title = VIDEO_TITLE;
      iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      iframe.allowFullscreen = true;
      document.getElementById('player').replaceWith(iframe);

      function cmd(func, args) {
        try {
          iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || [] }), 'https://www.youtube.com');
        } catch (e) {}
      }

      iframe.addEventListener('load', function () {
        removeLoading();
        btnSound.hidden = false;
        // pede ao player que avise mudancas de estado (para a tela de fim)
        try { iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'bc-player', channel: 'widget' }), 'https://www.youtube.com'); } catch (e) {}
        cmd('mute'); cmd('playVideo');
      });

      window.addEventListener('message', function (ev) {
        if (ev.origin !== 'https://www.youtube.com' || ev.source !== iframe.contentWindow) return;
        var d; try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
        if (!d) return;
        var state = d.event === 'onStateChange' ? d.info : (d.event === 'infoDelivery' && d.info && typeof d.info.playerState === 'number' ? d.info.playerState : null);
        if (state === 0) { btnSound.hidden = true; endScreen.hidden = false; }      // terminou
        else if (state === 1) { endScreen.hidden = true; }                          // tocando
      });

      btnSound.addEventListener('click', function () {
        btnSound.hidden = true;
        cmd('unMute'); cmd('setVolume', [100]);
        cmd('seekTo', [VIDEO_START, true]); // recomeca do inicio da fala, com som
        cmd('playVideo');
        window.dataLayer.push({ event: 'webinar_perpetuo_01_som_ativado' });
      });

      document.getElementById('video-replay').addEventListener('click', function () {
        endScreen.hidden = true;
        cmd('unMute'); cmd('seekTo', [VIDEO_START, true]); cmd('playVideo');
      });
    })();
  </script>
