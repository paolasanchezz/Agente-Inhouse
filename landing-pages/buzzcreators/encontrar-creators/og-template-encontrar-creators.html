<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#3a1652; --plum-2:#6a3895; --orange:#ff8119; --orange-dark:#ff7300;
    --offwhite:#f7f9fb; --gray:#eaeef1; --text:#1a1a1a; --text-3:#6b7280;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:#ffffff;
    font-family:'DM Sans',system-ui,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 84px;
  }
  .grad-bar{position:absolute;top:0;left:0;right:0;height:10px;
    background:linear-gradient(90deg,#3a1652 0%,#6a3895 35%,#ff8119 75%,#ff7300 100%)}
  .overline{
    display:inline-flex;align-items:center;gap:14px;
    font-size:22px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
    color:var(--plum);background:#f0e9f6;
    border-radius:9999px;padding:14px 28px;margin-bottom:38px;width:fit-content;
  }
  .dot{width:13px;height:13px;border-radius:50%;background:var(--orange)}
  h1{font-size:68px;font-weight:700;line-height:1.1;color:var(--text);max-width:700px;letter-spacing:-.025em}
  h1 .accent{background:linear-gradient(90deg,#6a3895 0%,#ff8119 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:26px;font-size:26px;font-weight:300;line-height:1.45;color:#4a4a4a;max-width:640px}
  .brand{position:absolute;bottom:52px;left:84px;display:flex;align-items:center;gap:20px}
  .brand img{height:40px;width:auto}
  .brand span{font-size:19px;color:var(--text-3);padding-left:20px;border-left:1px solid var(--gray)}

  /* mock do card, espelha o hero da LP: estrutura, sem dado de creator */
  .mock{position:absolute;right:70px;top:118px;width:352px;
    border:1px solid var(--gray);border-radius:24px;background:#fff;
    box-shadow:0 26px 56px -20px rgba(58,22,82,.26);overflow:hidden}
  .mock__bar{display:flex;align-items:center;gap:8px;padding:15px 18px;background:var(--offwhite);
    border-bottom:1px solid var(--gray)}
  .mock__dot{width:9px;height:9px;border-radius:50%;background:#cfd6dd}
  .mock__dot:first-child{background:var(--orange)}
  .mock__body{padding:22px;display:grid;gap:16px}
  .mock__row{display:flex;align-items:center;gap:13px}
  .mock__avatar{width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,#e6dcf0,#ffe2cc)}
  .mock__lines{display:grid;gap:8px;flex:1}
  .mock__line{height:9px;border-radius:999px;background:var(--gray)}
  .mock__label{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--plum-2)}
  .mock__field{display:grid;gap:8px}
  .mock__foot{display:flex;gap:8px}
  .mock__btn{height:30px;border-radius:8px;background:var(--offwhite);border:1px solid var(--gray);flex:1}
  .mock__btn--fill{background:var(--plum);border-color:var(--plum);flex:0 0 96px}
</style>
</head>
<body>
  <span class="grad-bar"></span>
  <div class="overline"><span class="dot"></span>Descoberta de creators</div>
  <h1>Encontre creators no <span class="accent">universo da sua marca</span></h1>
  <p class="sub">Veja sugestões iniciais e entenda o que conecta cada perfil ao seu contexto.</p>

  <div class="mock">
    <div class="mock__bar"><span class="mock__dot"></span><span class="mock__dot"></span><span class="mock__dot"></span></div>
    <div class="mock__body">
      <div class="mock__row">
        <span class="mock__avatar"></span>
        <span class="mock__lines">
          <span class="mock__line" style="width:60%"></span>
          <span class="mock__line" style="width:36%"></span>
        </span>
      </div>
      <div class="mock__field">
        <span class="mock__label">Por que apareceu</span>
        <span class="mock__line" style="width:100%"></span>
        <span class="mock__line" style="width:74%"></span>
      </div>
      <div class="mock__field">
        <span class="mock__label">Evidência</span>
        <span class="mock__line" style="width:62%"></span>
      </div>
      <div class="mock__foot">
        <span class="mock__btn"></span>
        <span class="mock__btn mock__btn--fill"></span>
      </div>
    </div>
  </div>

  <div class="brand">
    <img src="../../../brand/buzzcreators/assets/logos/logo-color.png" alt="">
    <span>Uma solução Buzzmonitor</span>
  </div>
</body>
</html>
