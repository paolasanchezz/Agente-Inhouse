name: Convites Moderador ClickMeeting

# Dispara 1 convite de moderador (role=presenter) para a proxima sessao de cada
# serie recorrente do ClickMeeting configurada em
# .claude/skills/convites-moderador/config.json (1 email por moderador por serie).
#
# STATUS (2026-07-07): o agendamento diario foi MIGRADO pro n8n — workflow
# "Convites Moderador ClickMeeting - diario 07h BRT" (id 1TFA4xHvFEZQ5lns) na instancia
# n8n-marketing-u54305.vm.elestio.app, roda 07:00 America/Sao_Paulo. Fonte versionada em
# integracoes/n8n/convites-moderador-clickmeeting.json.
#
# Este workflow do GitHub Actions virou FALLBACK MANUAL: esta desabilitado no GitHub
# (gh workflow disable convites-moderador.yml) e sem cron proprio (so workflow_dispatch).
# Se o n8n falhar: `gh workflow enable convites-moderador.yml` + aba Actions > Run workflow.
# NAO religar cron aqui enquanto o n8n estiver ativo — a API do ClickMeeting nao deduplica,
# entao os dois agendados juntos = convite em dobro.
#
# Historico: migramos remote-trigger claude.ai -> GitHub Actions em 2026-07-07 (IP do harness
# bloqueado pela ClickMeeting, mesmo motivo do lp-health-check.yml) e no mesmo dia -> n8n.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (nao envia, so lista o plano)"
        type: boolean
        default: false

jobs:
  enviar-convites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar convites de moderador
        env:
          CLICKMEETING_API_KEY: ${{ secrets.CLICKMEETING_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python .claude/skills/convites-moderador/send_invites.py --dry-run
          else
            python .claude/skills/convites-moderador/send_invites.py
          fi
